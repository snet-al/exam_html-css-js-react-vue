<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Fetcher</title>
    <link rel="stylesheet" href="photos.css">
</head>
<body>
    <header>
        <h1>Photo Fetcher</h1>
    </header>

    <main>
        <section class="toolbar">
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
                <p>Make photos grayscale</p>
            </label>
            <button class="fetch-btn">Fetch New Photos</button>
        </section>

        <section class="photo-holder">
            <article class="photo">
                <img src="https://picsum.photos/300/200" alt="photo">
                <footer class="overlay">
                    <h4>Lukas Budimaier</h4>
                    <p>https://picsum.photos/300/200</p>
                </footer>
            </article>
            <article class="photo">
                <img src="https://picsum.photos/300/200" alt="photo">
                <footer class="overlay">
                    <h4>Lukas Budimaier</h4>
                    <p>https://picsum.photos/300/200</p>
                </footer>
            </article>
            <article class="photo">
                <img src="https://picsum.photos/300/200" alt="photo">
                <footer class="overlay">
                    <h4>Lukas Budimaier</h4>
                    <p>https://picsum.photos/300/200</p>
                </footer>
            </article>
            <article class="photo">
                <img src="https://picsum.photos/300/200" alt="photo">
                <footer class="overlay">
                    <h4>Lukas Budimaier</h4>
                    <p>https://picsum.photos/300/200</p>
                </footer>
            </article>
        </section>
    </main>

    <footer>Footer here</footer>

</body>
</html>
