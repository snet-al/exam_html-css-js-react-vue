<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Photo Fetcher</title>

  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <main class="container">

    <header class="header">

      <h1>Photo Fetcher</h1>

      <div class="toolbar">

        <label class="toggle">
          <span class="slider"></span> 
          <span>Make photos grayscale</span> 
        </label>

        <button class="btn">
          Fetch New Photos
        </button>

      </div>

    </header>

    <section class="gallery">

      <article class="card">
        <img
          src="https://picsum.photos/400/300?random=1"
          alt="photo"
        />

        <div class="card-content">
            <div class="overlay">
                <h3>Lukas Budimaier</h3>
                <p>https://unsplash.com/photos</p>
            </div>
        </div>
      </article>

      <article class="card">
        <img
          src="https://picsum.photos/400/300?random=2"
          alt="photo"
        />

        <div class="card-content">
            <div class="overlay">
          <h3>Lukas Budimaier</h3>
          <p>https://unsplash.com/photos</p>
          </div>
        </div>
      </article>

      <article class="card">
        <img
          src="https://picsum.photos/400/300?random=3"
          alt="photo"
        />

        <div class="card-content">
            <div class="overlay">
          <h3>Lukas Budimaier</h3>
          <p>https://unsplash.com/photos</p>
          </div>
        </div>
      </article>

      <article class="card">
        <img
          src="https://picsum.photos/400/300?random=4"
          alt="photo"
        />

        <div class="card-content">
            <div class="overlay">
          <h3>Lukas Budimaier</h3>
          <p>https://unsplash.com/photos</p>
          </div>
        </div>
      </article>

    </section>

    <footer class="footer">
      <button class="btn full-width">
        More Photos
      </button>
    </footer>

  </main>

</body>
</html>
