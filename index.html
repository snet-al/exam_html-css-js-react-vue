<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Fetcher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page-container">
        <header>
            <h1>Photo Fetcher</h1>
            <div class="user-input-header">

                <div class="grayscale-toggle-group">
                    <label class="toggle-container">
                        <input type="checkbox"  id="grayscale-toggle">
                        <span class="slider round"></span>
                    </label>
                    <p>Make photos grayscale</p>
                </div>
                
                <button  class="fetch-button" id="fetch-new-photos">Fetch new Photos</button>
            </div>
        </header>

        <article class="images-container">
            
        </article>
        <footer>
            <button class="fetch-button" id="fetch-more-photos">More Photos</button>
        </footer>
        <script src="script.js"></script>
    </main>
</body>
</html>
