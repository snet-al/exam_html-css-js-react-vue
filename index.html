<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Fetcher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Photo Fetcher</h1>
            <div class="user-input-header">
                <div class="grayscale-group">
                    <label class="switch">
                        <input type="checkbox"  id="grayscale-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span>Make photos grayscale</span>
                </div>
                <button  class="fetch-buttons" id="fetch-new-photos">Fetch new Photos</button>
            </div>
        </header>

        <main class="images-container">
            
        </main>
        <footer>
            <button class="fetch-buttons" id="fetch-more-photos">More Photos</button>
        </footer>
        <script src="script.js"></script>
    </div>
</body>
</html>
