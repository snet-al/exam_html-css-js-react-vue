<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Photo Fetcher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>Photo Fetcher</h1>
    </header>
    <nav>
        <div class="toggle-container">
            <input type="checkbox" id="grayscale" />
            <label for="grayscale" class="toggle">
                <span class="toggle-off">X</span>
            </label>
            <p>Make photos grayscale</p>
        </div>
        <button>Fetch New Photos</button>
    </nav>
    <section class="photos-section">
        <div class="photos">
            <img src=images/dummy-img1.jpg alt="Dummy Image 1" />
            <img src=images/dummy-img2.jpg alt="Dummy Image 2" />
            <img src=images/dummy-img3.jpg alt="Dummy Image 3" />
            <img src=images/dummy-img4.jpg alt="Dummy Image 4" />
        </div>
        <button>More Photos</button>
    </section>
</body>
</html>
