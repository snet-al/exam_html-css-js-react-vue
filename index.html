<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Fetcher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Fetch Photos</h1>
        <div class="nav">
        <div class="togglegray">
          <label class="switch">
            <input type="checkbox" id="grayscaleToggle" />
            <span class="slider"></span>
          </label>
          <span>Make photos grayscale</span>
        </div>
        <button class="fetch-btn" id="fetch-btn">Fetch new photos</button>
        </div>
      </div>
      <div class="gallery" id="gallery"></div>
      <button class="load-more" id="load-more-btn">Load more</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
