<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Fetcher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1 class="title">Photo Fetcher</h1>
      <nav>
        <div class="switch-container">
          <div class="switch">
            <input type="checkbox" id="toggle-switch" class="switch-input" />
            <label for="toggle-switch" class="switch-label"></label>
          </div>
          <p>Make photos grayscale</p>
        </div>
        <button class="fetch-btn">Fetch New Photos</button>
      </nav>
    </header>
    <section class="card-container"></section>
    <footer>
      <button class="footer-btn">More Photos</button>
    </footer>
  </body>
  <script src="./index.js"></script>
</html>
