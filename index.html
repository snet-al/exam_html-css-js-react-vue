<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1 class="title">Picaroo</h1>
        </header>

        <section class="controls">
            <button class="fetch-btn" id="fetchNewPhotos">Fetch New Photos</button>
        </section>

        <section class="photo-grid" id="photoGrid">
            <article class="photo-card">
                <img src="https://picsum.photos/350/250?random=1" alt="Random photo" class="photo-image">
                <div class="photo-overlay">
                    <h3 class="photo-author">Sehir Mimar</h3>
                    <p class="photo-source">https://picsum.dev/image/1275</p>
                </div>
            </article>
            
            <article class="photo-card">
                <img src="https://picsum.photos/350/250?random=2" alt="Random photo" class="photo-image">
                <div class="photo-overlay">
                    <h3 class="photo-author">️ Yemek Kultur</h3>
                    <p class="photo-source">https://picsum.dev/image/1277</p>
                </div>
            </article>
            
            <article class="photo-card">
                <img src="https://picsum.photos/350/250?random=3" alt="Random photo" class="photo-image">
                <div class="photo-overlay">
                    <h3 class="photo-author"> Woman Painting </h3>
                    <p class="photo-source">https://picsum.dev/image/1248</p>
                </div>
            </article>
            
            <article class="photo-card">
                <img src="https://picsum.photos/350/250?random=4" alt="Random photo" class="photo-image">
                <div class="photo-overlay">
                    <h3 class="photo-author">Suitcase</h3>
                    <p class="photo-source">https://picsum.dev/image/1246</p>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
