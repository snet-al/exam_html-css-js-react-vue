<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Photo Fetcher</title>
        <link rel="stylesheet" href="style.css" >
    </head>
    <body>
        <main class="container">
            <h2>Photo Fetcher</h2>
            <header class="app-header">
                <div class="toggle-container">
                    <label class="switch">
                        <input type="checkbox" id="grayscale">
                        <span class="slider"></span>
                    </label>
                    <span>Make photos grayscale</span>
                </div>
            <button class="fetch-btn">Fetch New Photos</button>
            </header>
            <section class="gallery">
                <figure class="photo-card">
                    <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f"
                    alt="photo 1" >
                    <figcaption>
                        <p>Lukas Budimaier</p>
                        <a href="https://unsplash.com/photos/pwaaqfoMibi">https://unsplash.com/photos/pwaaqfoMibi</a>
                    </figcaption>
                </figure>
                <figure class="photo-card">
                    <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab"
                    alt="photo 2">
                    <figcaption>
                        <p>Lukas Budimaier</p>
                        <a href="https://unsplash.com/photos/pwaaqfoMibi">https://unsplash.com/photos/pwaaqfoMibi</a>
                    </figcaption>
                </figure>
                <figure class="photo-card">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9" 
                    alt="photo 3">
                    <figcaption>
                        <p>Lukas Budimaier</p>
                        <a href="https://unsplash.com/photos/pwaaqfoMibi">https://unsplash.com/photos/pwaaqfoMibi</a>
                    </figcaption>
                </figure>
                <figure class="photo-card">
                    <img src="https://plus.unsplash.com/premium_photo-1794227548897-6f0a8667d98d?" 
                    alt="photo 4">
                    <figcaption>
                        <p>Lukas Budimaier</p>
                        <a href="https://unsplash.com/photos/pwaaqfoMibi">https://unsplash.com/photos/pwaaqfoMibi</a>
                    </figcaption>
                </figure>
            </section>
        </main>
    </body>
</html>
