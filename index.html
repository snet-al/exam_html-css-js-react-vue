\<!DOCTYPE html>

\<html lang="en"> \<head>     \<meta charset="UTF-8">     \<meta name="viewport" content="width=device-width, initial-scale=1.0">     \<title>Photo Fetcher\</title>     \<link rel="stylesheet" href="style.css"> \</head> \<body>

```
<header class="page-header">
    <h1>Photo Fetcher</h1>
</header>

<main class="container">

    <section class="controls" aria-label="Photo controls">

        <label class="toggle-container">
            <input type="checkbox" id="grayscale-toggle">
            <span class="toggle-slider"></span>
            <span>Grayscale</span>
        </label>

        <button type="button" class="fetch-button">
            Fetch New Photos
        </button>

    </section>

    <section class="photo-gallery" aria-label="Photo gallery">

        <article class="photo-card">
            <img src="https://picsum.photos/id/10/400/300" alt="Forest landscape">
            <div class="photo-info">
                <p>Photographer: Example</p>
                <p>Image URL: picsum.photos</p>
            </div>
        </article>

        <article class="photo-card">
            <img src="https://picsum.photos/id/20/400/300" alt="Nature photograph">
            <div class="photo-info">
                <p>Photographer: Example</p>
                <p>Image URL: picsum.photos</p>
            </div>
        </article>

        <article class="photo-card">
            <img src="https://picsum.photos/id/30/400/300" alt="Outdoor landscape">
            <div class="photo-info">
                <p>Photographer: Example</p>
                <p>Image URL: picsum.photos</p>
            </div>
        </article>

        <article class="photo-card">
            <img src="https://picsum.photos/id/40/400/300" alt="Scenic photograph">
            <div class="photo-info">
                <p>Photographer: Example</p>
                <p>Image URL: picsum.photos</p>
            </div>
        </article>

    </section>

</main>

<footer class="page-footer">
    <p>Photo Fetcher</p>
</footer>
```

\</html>
