<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Photo Fetcher</title>
        <link rel = "stylesheet" href = "style.css">
    </head>
    
<body>
    
    <main class="container">

        <header><h2>Photo Fetcher</h2></header>

        <section class="controls">

            <label class="switch">
                <input type="checkbox" class="js-grayscaleToggle">
                <span class="slider">✕</span>
            </label>

            <span>Make photos grayscale</span>
            <button class = 'js-fetch-button' id="fetchBtn">Fetch New Photos</button>

        </section>

        <section class="photo-grid js-photo"></section>

    </main>

    <script type = "module" src = "main.js"></script>

</body>
</html>
