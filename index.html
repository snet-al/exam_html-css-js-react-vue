<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Fetcher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="mainContainer">
      <header class="headerSection">
        <h1>Fetch Photos</h1>
        <nav class="navBar">
          <section class="grayscaleToggle" aria-label="Grayscale Toggle">
            <label class="toggleSwitch">
              <input type="checkbox" id="grayscaleToggle" />
              <span class="sliderToggle"></span>
            </label>
            <span>Make photos grayscale</span>
          </section>
          <button class="actionButton" id="fetchBtn">Fetch new photos</button>
        </nav>
      </header>

      <section id="gallerySection" class="gallerySection" aria-label="Photo Gallery"></section>

      <footer class="pageFooter">
        <button class="actionButton" id="loadMoreBtn">Load more</button>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
