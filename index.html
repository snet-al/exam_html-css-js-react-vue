<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Fetcher</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <header class="container header-section">
    <h1>Photo Fetcher</h1>

    <div class="controls-section">
      <label class="toggle">
        <input type="checkbox" />
        <span class="switch"></span>
        Make photos grayscale
      </label>

      <button class="btn" type="button">Fetch New Photos</button>
    </div>
  </header>

  <main class="container">
    <section class="gallery-section">
      <div class="grid">
        <figure class="card">
          <img src="https://picsum.photos/id/1015/600/400" alt="Photo" />
          <figcaption>
            <span class="name">Lukas Budimaier</span>
            <a class="link" href="https://unsplash.com/photos/pwaaqfoMibl">https://unsplash.com/photos/pwaaqfoMibl</a>
          </figcaption>
        </figure>

        <figure class="card">
          <img src="https://picsum.photos/id/1020/600/400" alt="Photo" />
          <figcaption>
            <span class="name">Lukas Budimaier</span>
            <a class="link" href="https://unsplash.com/photos/pwaaqfoMibl">https://unsplash.com/photos/pwaaqfoMibl</a>
          </figcaption>
        </figure>

        <figure class="card">
          <img src="https://picsum.photos/id/1024/600/400" alt="Photo" />
          <figcaption>
            <span class="name">Lukas Budimaier</span>
            <a class="link" href="https://unsplash.com/photos/pwaaqfoMibl">https://unsplash.com/photos/pwaaqfoMibl</a>
          </figcaption>
        </figure>

        <figure class="card">
          <img src="https://picsum.photos/id/1025/600/400" alt="Photo" />
          <figcaption>
            <span class="name">Lukas Budimaier</span>
            <a class="link" href="https://unsplash.com/photos/pwaaqfoMibl">https://unsplash.com/photos/pwaaqfoMibl</a>
          </figcaption>
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
